[package]
name = "rdns"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
trust-dns-resolver = "0.23"
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
notify = "7.0"

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "dns_benchmarks"
harness = false
